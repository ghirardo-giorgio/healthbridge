# Compila l'APK di release e lo allega a una release di GitHub.
#
# Si attiva spingendo un tag che comincia per v (git tag v1.1.0 && git push
# --tags), oppure a mano dalla scheda Actions quando serve solo un APK da
# provare senza pubblicare niente.
#
# La firma arriva da quattro secrets del repository. Se mancano, il job si
# ferma subito con un messaggio invece di pubblicare un APK non installabile:
# le istruzioni per crearli sono nel README, sezione Releases.
name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verifica i secrets di firma
        env:
          KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ] || missing="$missing KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "Secrets mancanti:$missing" >&2
            echo "Vedi la sezione Releases del README per crearli." >&2
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Il keystore vive solo nel runner, fuori dalla working copy, e sparisce
      # con la macchina alla fine del job.
      - name: Ricostruisci il keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      # Da refs/tags/v1.1.0 resta 1.1.0. Su avvio manuale non c'è tag: l'APK
      # prende il nome della run e non viene pubblicato.
      - name: Ricava la versione
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-run${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compila l'APK di release
        env:
          HEALTHBRIDGE_KEYSTORE: ${{ runner.temp }}/release.jks
          HEALTHBRIDGE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          HEALTHBRIDGE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HEALTHBRIDGE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          HEALTHBRIDGE_VERSION_NAME: ${{ steps.version.outputs.name }}
          HEALTHBRIDGE_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rinomina l'APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             "$RUNNER_TEMP/healthbridge-${{ steps.version.outputs.name }}.apk"

      - name: Cancella il keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      # Sull'avvio manuale l'APK resta qui, scaricabile dalla pagina della run.
      - uses: actions/upload-artifact@v4
        with:
          name: healthbridge-${{ steps.version.outputs.name }}
          path: ${{ runner.temp }}/healthbridge-*.apk

      - name: Pubblica la release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "$RUNNER_TEMP/healthbridge-${{ steps.version.outputs.name }}.apk"
