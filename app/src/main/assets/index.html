<body>

<header>
  <div>
    <h1>HealthBridge</h1>
    <p id="freshness" class="dim" data-i18n="reading">…</p>
  </div>
  <button id="reload" type="button" data-i18n="reload" data-i18n-title="reloadTitle">…</button>
</header>

<p id="trouble" class="trouble" hidden></p>

<section class="card">
  <div class="cardhead">
    <h2 data-i18n="heart">…</h2>
    <div class="tabs" id="windows">
      <button type="button" data-minutes="60">1 h</button>
      <button type="button" data-minutes="360">6 h</button>
      <button type="button" data-minutes="1440">24 h</button>
    </div>
  </div>

  <p class="huge"><span id="bpm">—</span><span class="unit">bpm</span></p>

  <!--
    Il grafico lo disegna app.js dentro questo SVG. Vuoto qui e non un
    placeholder: uno scheletro finto che compare per mezzo secondo e poi cambia
    forma si legge come un salto, e questa pagina si ricarica da sola ogni
    minuto.
  -->
  <svg id="chart" viewBox="0 0 720 220" preserveAspectRatio="none" data-i18n-label="heartOverTime"></svg>

  <dl class="row" id="span"></dl>
</section>

<section class="card">
  <h2 data-i18n="today">…</h2>
  <dl class="grid" id="today"></dl>
</section>

<section class="card">
  <h2 data-i18n="sleep">…</h2>
  <div id="sleep"><p class="dim">—</p></div>
</section>

<section class="card">
  <details id="diagnosis">
    <summary><h2 data-i18n="whatsInside">…</h2></summary>
    <div id="probe"><p class="dim" data-i18n="openToRead">…</p></div>
  </details>
</section>

<section class="card" id="apihelp">
  <h2 data-i18n="apiTitle">…</h2>
  <div id="apibody"><p class="dim" data-i18n="reading">…</p></div>
</section>

<footer>
  <p id="schedule" class="dim"></p>
  <p class="dim" data-i18n="footerNote">…</p>
</footer>

<script src="app.js"></script>
</body>
</html>
